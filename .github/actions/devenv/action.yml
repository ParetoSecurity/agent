name: "Devenv setup"
description: "Setup devenv for running tests and linters"
inputs:
  devenv:
    description: "Devenv version to install"
    required: false
    default: "github:cachix/devenv/v1.11.2"
runs:
  using: "composite"
  steps:
  - uses: cachix/install-nix-action@v31
    with:
      extra_nix_config: |
        system-features = kvm nixos-test
  - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
    with:
      # Matrix jobs share one snapshot instead of caching eleven copies of Nix.
      primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/*.nix', 'flake.lock', 'devenv.lock', '.github/actions/devenv/action.yml') }}
      restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      gc-max-store-size-linux: 2G
  - name: Install devenv.sh
    shell: bash
    run: |
      if ! command -v devenv &> /dev/null; then
        nix profile install --accept-flake-config ${{ inputs.devenv }}
      fi
